          # 单独处理SSH密钥生成，并验证文件是否创建成功
          echo "Setting up SSH keys..."
          docker exec kubespray-node bash -c "
            mkdir -p /home/kubespray/.ssh
            ssh-keygen -t rsa -f /home/kubespray/.ssh/id_rsa -N ''
            cp /home/kubespray/.ssh/id_rsa.pub /home/kubespray/.ssh/authorized_keys
            chown -R kubespray:kubespray /home/kubespray/.ssh
            chmod 700 /home/kubespray/.ssh
            chmod 600 /home/kubespray/.ssh/authorized_keys
            chmod 600 /home/kubespray/.ssh/id_rsa
            
