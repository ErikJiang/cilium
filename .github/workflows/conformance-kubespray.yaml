          path: kubespray
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Kubespray
        run: |
          python -m venv kubespray-venv
          source kubespray-venv/bin/activate
          cd kubespray
          pip install -r requirements.txt

      - name: Configure inventory
        run: |
          cd kubespray/
          cp -rfp inventory/sample inventory/mycluster
          
          # 使用绝对路径而不是相对路径
          SSH_KEY_PATH=$(realpath ../kubespray_key)
          echo "SSH key absolute path: $SSH_KEY_PATH"

          cat > inventory/mycluster/inventory.ini << EOF
           [all]
          kubespray-node ansible_host=${{ steps.create-node.outputs.container_ip }} ansible_user=kubespray ansible_ssh_private_key_file=${SSH_KEY_PATH} ansible_ssh_common_args='-o StrictHostKeyChecking=no'

          [kube_control_plane]
          kubespray-node

          [etcd]
          kubespray-node

          [kube_node]
          kubespray-node

          [k8s_cluster:children]
          kube_control_plane
          kube_node
          EOF

          echo "Inventory configuration:"
          cat inventory/mycluster/inventory.ini

      - name: Deploy Kubernetes cluster
        run: |
          source kubespray-venv/bin/activate
          cd kubespray/

          echo "Testing Ansible connectivity..."
          ls -la $(realpath ../kubespray_key)
          chmod 600 $(realpath ../kubespray_key)
          
          ansible -i inventory/mycluster/inventory.ini all -m ping

          ansible-playbook -i inventory/mycluster/inventory.ini cluster.yml -b -vvv \
            -e "kube_api_server_ip=${{ steps.create-node.outputs.container_ip }}" \
            -e "supplementary_addresses_in_ssl_keys=['${{ steps.create-node.outputs.container_ip }}']" \
            -e '{"kube_network_plugin": "cni"}' \
            -e '{"kube_owner": "root"}' \
            -e '{"kubelet_fail_swap_on": false}' \
            -e '{"kubeadm_ignore_preflight_errors": ["SystemVerification"]}' \
            -e '{"resolvconf_mode": "none"}' \
            -e '{"enable_nodelocaldns": false}'\
            -e '{"etcd_deployment_type": "kubeadm"}'

          # mkdir -p $HOME/.kube
          # sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          # sudo chown "$(id -u)":"$(id -g)" $HOME/.kube/config

          # kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s

      - name: Setup tmate session
        if: ${{ always() }}
        uses: mxschmitt/action-tmate@v3

      - name: Setup kubectl access
        run: |
          echo "Setting up kubectl access..."

          docker exec kubespray-node test -f /etc/kubernetes/admin.conf

          docker cp kubespray-node:/etc/kubernetes/admin.conf ./admin.conf
          
          mkdir -p $HOME/.kube
          cp ./admin.conf $HOME/.kube/config
          cat $HOME/.kube/config

          sed -i "s/127.0.0.1/${{ steps.create-node.outputs.container_ip }}/g" $HOME/.kube/config
          sed -i "s/localhost/${{ steps.create-node.outputs.container_ip }}/g" $HOME/.kube/config
          cat $HOME/.kube/config
          
          echo "Kubernetes cluster info:"
          kubectl cluster-info
          
          echo "Waiting for nodes to be ready..."
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          
          echo "Waiting for system pods to be ready..."
          kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
          
          echo "Current cluster status:"
          kubectl get nodes -o wide
          kubectl get pods --all-namespaces

